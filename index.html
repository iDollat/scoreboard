<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0f0d">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Hala DT – przeniesiono</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0f0d; color: #e9f1ec; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    .box { max-width: 420px; }
    img { width: 64px; height: 64px; }
    a { color: #22c55e; font-weight: 700; }
    #status { color: #8b9b93; }
  </style>
</head>
<body>
  <div class="box">
    <img src="icon.svg" alt="">
    <h1>Przenieśliśmy się!</h1>
    <p>Nowy adres: <a id="target" href="https://hala-dt.netlify.app">hala-dt.netlify.app</a></p>
    <p id="status">Chwileczkę…</p>
  </div>
  <script>
    /* Strona przejściowa pod starym adresem (GitHub Pages).
       1. Wysyła historię meczów zapisaną na tym telefonie (stara wersja trzymała ją
          w przeglądarce, dostępną tylko pod tym adresem) do wspólnej bazy.
       2. Usuwa stary service worker i przekierowuje na nowy adres. */
    (async () => {
      const TARGET = 'https://hala-dt.netlify.app';
      const CONVEX = 'https://befitting-spoonbill-988.eu-west-1.convex.cloud';
      const status = document.getElementById('status');
      const route = (location.hash || '').replace(/^#\/?/, '').split('/')[0];
      const path = { historia: '/historia', statystyki: '/statystyki', zapisy: '/terminy', zaproszenie: '/terminy' }[route] || '/';
      document.getElementById('target').href = TARGET + path;

      try {
        const regs = navigator.serviceWorker ? await navigator.serviceWorker.getRegistrations() : [];
        for (const r of regs) await r.unregister();
      } catch (e) { /* bez znaczenia */ }

      let note = '';
      try {
        const raw = localStorage.getItem('scoreboard.v2');
        const data = raw && JSON.parse(raw);
        const hasHistory = data && Array.isArray(data.matches) && data.matches.some((m) => m && m.status === 'done');
        if (hasHistory && !localStorage.getItem('scoreboard.migrated')) {
          status.textContent = 'Przenoszę historię meczów z tego telefonu do wspólnej bazy…';
          const res = await fetch(CONVEX + '/api/mutation', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path: 'legacy:importLocal', args: { data }, format: 'json' }),
          });
          const body = await res.json();
          if (body.status !== 'success') throw new Error(body.errorMessage || 'błąd serwera');
          localStorage.setItem('scoreboard.migrated', String(Date.now()));
          const pl = (n, a, b, c) => n === 1 ? a : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? b : c;
          const v = body.value;
          note = `✅ Przeniesiono ${v.matches} ${pl(v.matches, 'mecz', 'mecze', 'meczów')} i ${v.players} ${pl(v.players, 'nowego zawodnika', 'nowych zawodników', 'nowych zawodników')}.`;
        }
      } catch (e) {
        status.innerHTML = '⚠️ Nie udało się przenieść historii z tego telefonu. Sprawdź internet i <a href="">odśwież stronę</a>.';
        return;
      }
      status.textContent = (note ? note + ' ' : '') + 'Przekierowuję…';
      setTimeout(() => location.replace(TARGET + path), note ? 3000 : 400);
    })();
  </script>
</body>
</html>
