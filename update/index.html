<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Scoreboard – przeniesiono</title>
  <script>
    // Wersja beta jest teraz wersją główną – przekieruj, zachowując adres w aplikacji (#/...)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => { if (r.scope.endsWith('/update/')) r.unregister(); }));
    }
    location.replace('../' + location.hash);
  </script>
</head>
<body style="background:#0a0f0d;color:#e9f1ec;font-family:system-ui;text-align:center;padding:40px">
  <p>Scoreboard przeniósł się na <a href="../" style="color:#22c55e">stronę główną</a>.</p>
</body>
</html>
